# nginx (alternativa ao Caddy). Copie para /etc/nginx/sites-available/rastrewin, crie o link em
# sites-enabled e rode `sudo certbot --nginx -d track.rastrewin.com`: o certbot acrescenta o HTTPS
# (listen 443 + certificado) e o redirecionamento do HTTP. Detalhes em docs/go-live.md.

server {
    listen 80;
    listen [::]:80;
    server_name track.rastrewin.com;

    server_tokens off;
    # Corpo máximo (o maior endpoint aceita 64 KB; o app ainda valida o seu limite).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IP REAL do visitante: SOBRESCREVER (nunca $proxy_add_x_forwarded_for, que mantém o valor
        # enviado pelo navegador). O app só confia nestes cabeçalhos (src/lib/http/client-ip.ts).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_read_timeout 30s;
    }
}
