name: rastrewin
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: sorteio
      POSTGRES_PASSWORD: sorteio
      POSTGRES_DB: sorteio
    ports: ["127.0.0.1:5436:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sorteio]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres:
