# Ambiente local / referência de produção.
# Uso: cp .env.example .env  (preencha)  &&  docker compose up -d --build
services:
  db:
    build: ./docker/postgres
    image: ghcr.io/${GHCR_OWNER:-local}/rastrewin-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: rastrewin
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      CRON_DATABASE: rastrewin
    volumes:
      # Postgres 18: o volume é /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d rastrewin"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ghcr.io/${GHCR_OWNER:-local}/rastrewin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
