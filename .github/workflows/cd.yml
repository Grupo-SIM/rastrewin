name: CD - images

# Publishes the backend, frontend, track and vsl images to GHCR as
# ghcr.io/<owner>/rastrewin_<service>.
on:
  push:
    branches: [main]
  # Monthly rebuild so track picks up the new geolocation database (DB-IP publishes one per month).
  schedule:
    - cron: "0 6 4 * *"
  workflow_dispatch:
    inputs:
      target:
        description: Images to publish
        type: choice
        options: [all, backend, frontend, track, vsl]
        default: all

permissions:
  contents: read

concurrency:
  group: cd-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compute affected packages
        id: affected
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Scheduled runs have no base to diff against.
          [ "$EVENT" = schedule ] && BASE_SHA=
          echo "tasks=$(bun scripts/affected-packages.ts "$BASE_SHA" build)" >> "$GITHUB_OUTPUT"
      - name: Plan image matrix
        id: plan
        env:
          TASKS: ${{ steps.affected.outputs.tasks }}
          TARGET: ${{ inputs.target || (github.event_name == 'schedule' && 'track') || 'affected' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          affected = json.loads(os.environ["TASKS"]).get("build", [])
          target = os.environ["TARGET"]
          services = [
              {"service": "backend", "dockerfile": "backend/Dockerfile", "platforms": "linux/amd64"},
              {"service": "frontend", "dockerfile": "frontend/Dockerfile", "platforms": "linux/amd64"},
              {"service": "track", "dockerfile": "track/Dockerfile", "platforms": "linux/amd64"},
              {"service": "vsl", "dockerfile": "vsl/Dockerfile", "platforms": "linux/amd64,linux/arm64"},
          ]
          matrix = [s for s in services if target in ("all", s["service"]) or target == "affected" and s["service"] in affected]
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY

  images:
    name: Image / ${{ matrix.service }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: geo
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/rastrewin_${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.service == 'track' && format('GEO_MONTH={0}', steps.geo.outputs.month) || '' }}
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Publication summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rastrewin_${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published `%s@%s` from `%s`\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
