# Publica a imagem do site no GHCR (ghcr.io/grupo-sim/vslrastrewin) para amd64 e arm64.
# Roda em push na main e manualmente (Actions → Publicar imagem → Run workflow).
# Ações externas fixadas por hash de commit (a tag ao lado é só referência).
name: Publicar imagem

on:
  push:
    branches: [main]
  workflow_dispatch:

# Push novo cancela a publicação anterior ainda em andamento: só a mais recente importa.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

# Mínimo necessário: ler o código e publicar o pacote.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Emulação ARM só para os comandos curtos da etapa final; o build do site roda nativo.
      - name: Preparar emulação ARM
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Entrar no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest (só na main) + sha-<commit curto>, para voltar a qualquer versão.
      # Os labels OCI ligam o pacote a este repositório (acesso herdado do repo).
      - name: Definir tags e labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Os testes rodam dentro do build (deploy/Dockerfile): teste quebrado não publica imagem.
      - name: Build e publicação
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
