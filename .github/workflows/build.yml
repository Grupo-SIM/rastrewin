name: Build & publish images

# Builda as imagens Docker e publica no GitHub Container Registry (GHCR).
# O deploy (puxar a imagem nova) fica fora deste workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plataformas (ex.: linux/amd64 ou linux/amd64,linux/arm64)"
        required: false
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: ./Dockerfile
            image: rastrewin
          - name: postgres
            context: ./docker/postgres
            file: ./docker/postgres/Dockerfile
            image: rastrewin-postgres
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
