services:
  backend:
    image: ghcr.io/grupo-sim/rastrewin_backend:${IMAGE_TAG:-latest}
    pull_policy: always
    env_file: .env
    environment:
      - WEB_ORIGIN=https://rastrewin.com
    networks:
      - internal
      - proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Disco só leitura: a API não grava arquivos. O boot (npx prisma db push e tsx do seed-admin) usa
    # /tmp e a home do usuário, que ficam em memória.
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    labels:
      caddy: api.rastrewin.com
      caddy.import: cloudflare
      caddy.reverse_proxy: "{{upstreams 3011}}"

  frontend:
    image: ghcr.io/grupo-sim/rastrewin_frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      - PORT=3000
      - API_INTERNAL_URL=http://backend:3011
    networks:
      - proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Disco só leitura; o cache do Next (páginas e imagens) fica em memória.
    read_only: true
    tmpfs:
      - /tmp
      - /app/frontend/.next/cache
    labels:
      caddy: rastrewin.com
      caddy.import: cloudflare
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  internal:
  proxy:
    external: true
